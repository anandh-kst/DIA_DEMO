                    type: integer
                    example: 1300000
                  linkId:
                    type: string
                    example: "2022150359"
                  billTo:
                    type: string
                    example: "2907984"
                  billToLocation:
                    type: string
                    example: "TIME SQUARE-MUMBAI"
                  billToAddress:
                    type: string
                    example: "No. 302,B-Wing,3rd Floor,,Time square,A.K Road,,,4,Mumbai,Maharashtra-400049"
                  shipTo:
                    type: string
                    example: "2901747"
                  shipToLocation:
                    type: string
                    example: "BHIWANDI-10111"
                  shipToAddress:
                    type: string
                    example: "Iron Mountain LTD, R.K. Logistics Compound, Gala No. A-1, Survey No. 66,,Mumbai-Nashik Highway,Khadavali, Bhiwandi,Nr. Khadavali Phata-421605,,4,Bhiwandi,Maharashtra-421605"
                  shipSiteCode:
                    type: string
                    example: "BHIWANDI-10111"
              reqId:
                type: integer
                example: 0
              locationId:
                type: integer
                example: 0
              quoteType:
                type: string
                example: "modifyBandwidth"
              sameContactForAll:
                type: boolean
                example: false
              shippingAddress:
                type: object
                properties:
                  address1:
                    type: string
                    example: "No.5, 12th Main Road"
                  address2:
                    type: string
                    example: "Vijaya Nagar"
                  address3:
                    type: string
                    example: "Velacheri"
                  city:
                    type: string
                    example: "Chennai "
                  state:
                    type: string
                    example: "Tamil Nadu"
                  pincode:
                    type: integer
                    example: 600042
                  latitude:
                    type: string
                    example: "0.00 N"
                  longitude:
                    type: string
                    example: "0.00 E"
                  officeFloor:
                    type: string
                    example: "G + 1"
                  totalFloor:
                    type: string
                    example: "G + 2"
