                        type: string
                        example: null,
                      address4:
                        type: string
                        example: "04"
                      city:
                        type: string
                        example: "NEW DELHI"
                      state:
                        type: string
                        example: "Delhi"
                      pincode:
                        type: string
                        example: "110055"
