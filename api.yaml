                type: integer
                example: 7
              reqBandwidthUOM:
                type: string
                example: "Mbps"
              connectionType:
                type: string
                example: "Wireless"
              serviceProvider:
                type: string
                example: "BSNL"
              hasRateCard:
                type: boolean
                example: false
              rateCode:
                type: string
                example: "HDFC_LTD_Apr23-Mar24"
              parentRole:
                type: string
                example: ""
              companyId:
                type: string
                example: ""
              partyId:
                type: string
                example: ""
              partyNo:
                type: string
                example: ""
              ebsAccountNo:
                type: string
                example: ""
              companyName:
                type: string
                example: ""
