                type: object
                properties:
                  contactFirstName:
                    type: string
                    example: "Hello"
                  contactLastName:
                    type: string
                    example: "World"
                  contactPhoneNumber1:
                    type: integer
                    example: 9876543210
                  contactPhoneNumber2:
                    type: integer
                    example: 9876543210
                  contactEmail:
                    type: string
                    example: "string@gmail.com"
